<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Fuel & Pitstop Map Tracker</title>
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #111827;
            --text-light: #4b5563;
            --border: #e5e7eb;
            --accent: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-light);
        }

        /* Search Bar styling */
        .search-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .search-container input {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }

        .search-container button {
            width: auto;
            padding: 0.75rem 1.5rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 900px) {
            .main-layout {
                grid-template-columns: 1.2fr 1.8fr;
            }
        }

        /* Map Container */
        #map {
            height: 450px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 1;
        }

        /* Card Elements */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 1.25rem;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-light);
        }

        input, select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox-label input {
            width: auto;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Filter Controls */
        .filter-section {
            background: #eef2f6;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        /* Station Cards Output */
        .station-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .station-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .station-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
            border-color: var(--primary);
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .station-title h3 {
            font-size: 1.2rem;
            color: var(--text);
        }

        .station-title p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .price-badge {
            background-color: #ecfdf5;
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #a7f3d0;
        }

        .amenity-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .amenity-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            background-color: #f3f4f6;
            color: var(--text-light);
        }

        .amenity-badge.highlight {
            background-color: #fef3c7;
            color: var(--accent);
        }

        .highway-info {
            font-size: 0.85rem;
            color: var(--text-light);
            font-style: italic;
        }

        .map-instruction {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
            display: block;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Local Fuel & Pitstop Map</h1>
        <p>Search, pan the map, or report new prices to find the best roadside amenities in real-time.</p>
    </header>

    <!-- Map Search -->
    <div class="search-container">
        <input type="text" id="map-search" placeholder="Enter a city, ZIP code, or landmark (e.g., Boston, MA)..." onkeypress="if(event.key === 'Enter') executeSearch()">
        <button onclick="executeSearch()">Go to Location</button>
    </div>

    <div class="main-layout">
        <!-- Sidebar: Report Form & Station Filters -->
        <div>
            <!-- Report Form -->
            <div class="card">
                <h2>Report Current Station</h2>
                <p style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 1rem;">
                    💡 Click anywhere on the map to pinpoint a station, or fill out the coordinates manually.
                </p>
                <form id="report-form" onsubmit="handleReportSubmit(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="station-lat">Latitude</label>
                            <input type="number" id="station-lat" step="any" placeholder="41.7003" required>
                        </div>
                        <div class="form-group">
                            <label for="station-lng">Longitude</label>
                            <input type="number" id="station-lng" step="any" placeholder="-70.3002" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="station-name">Station Name / Brand</label>
                        <input type="text" id="station-name" placeholder="e.g., Shell, Mobil, Buc-ee's" required>
                    </div>
                    <div class="form-group">
                        <label for="station-address">Street Address / Exit</label>
                        <input type="text" id="station-address" placeholder="e.g., 102 Main St" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fuel-type">Fuel Type</label>
                            <select id="fuel-type">
                                <option value="Regular">Regular</option>
                                <option value="Midgrade">Midgrade</option>
                                <option value="Premium">Premium</option>
                                <option value="Diesel">Diesel</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="gas-price">Price per Gallon ($)</label>
                            <input type="number" id="gas-price" step="0.01" min="0.01" placeholder="3.49" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="highway-dist">Distance to Highway Exit</label>
                        <select id="highway-dist">
                            <option value="0.1 miles">Right off exit (&lt; 0.1 mi)</option>
                            <option value="0.5 miles">Under 0.5 miles</option>
                            <option value="1.0 miles">Under 1 mile</option>
                            <option value="3+ miles">3+ miles away</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amenities</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="amenity-restroom"> 🚻 Clean Restrooms
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="amenity-store"> 🏪 C-Store
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="amenity-food"> 🍔 Hot/Fresh Food
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="amenity-ev"> ⚡ EV Charging
                            </label>
                        </div>
                    </div>
                    <button type="submit">Submit Station Data</button>
                </form>
            </div>
        </div>

        <!-- Main Panel: Interactive Map and Filtered List -->
        <div>
            <span class="map-instruction">🗺️ Click on the map to drop a pin for a new station.</span>
            <!-- Interactive Map Div -->
            <div id="map"></div>

            <!-- Filters -->
            <div class="card filter-section">
                <div class="form-row" style="grid-template-columns: 2fr 1fr;">
                    <div>
                        <label for="filter-fuel">Filter Fuel Type</label>
                        <select id="filter-fuel" onchange="updateView()">
                            <option value="All">All Fuel Types</option>
                            <option value="Regular">Regular</option>
                            <option value="Midgrade">Midgrade</option>
                            <option value="Premium">Premium</option>
                            <option value="Diesel">Diesel</option>
                        </select>
                    </div>
                    <div>
                        <label for="filter-amenity">Must Have:</label>
                        <select id="filter-amenity" onchange="updateView()">
                            <option value="Any">Any Feature</option>
                            <option value="restrooms">🚻 Restrooms</option>
                            <option value="store">🏪 C-Store</option>
                            <option value="food">🍔 Hot Food</option>
                            <option value="ev">⚡ EV Charging</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- List Output -->
            <div class="station-list" id="station-list">
                <!-- Dynamically populated based on map boundaries -->
            </div>
        </div>
    </div>
</div>

<!-- Leaflet JS for Map -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    // Initial coordinate seed (Yarmouth, Cape Cod, MA region)
    const initialLat = 41.7003;
    const initialLng = -70.3002;

    // Seed Data with Latitudes and Longitudes
    let stations = [
        {
            id: 1,
            name: "Buc-ee's",
            address: "1200 Route 6 Eastbound",
            lat: 41.7035,
            lng: -70.2910,
            fuelType: "Regular",
            price: 3.19,
            highwayDist: "0.1 miles",
            amenities: { restrooms: true, store: true, food: true, ev: true }
        },
        {
            id: 2,
            name: "Shell",
            address: "450 Route 6 Westbound",
            lat: 41.6912,
            lng: -70.3195,
            fuelType: "Premium",
            price: 4.05,
            highwayDist: "0.5 miles",
            amenities: { restrooms: true, store: true, food: false, ev: false }
        },
        {
            id: 3,
            name: "Mobil",
            address: "80 Route 132",
            lat: 41.6830,
            lng: -70.3020,
            fuelType: "Regular",
            price: 3.32,
            highwayDist: "0.1 miles",
            amenities: { restrooms: true, store: true, food: true, ev: false }
        },
        {
            id: 4,
            name: "Cumberland Farms",
            address: "210 Main St",
            lat: 41.7180,
            lng: -70.2650,
            fuelType: "Diesel",
            price: 3.89,
            highwayDist: "1.0 miles",
            amenities: { restrooms: true, store: true, food: true, ev: true }
        }
    ];

    // Initialize Map
    const map = L.map('map').setView([initialLat, initialLng], 12);

    // Load OpenStreetMap Map Tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let mapMarkers = [];
    let clickMarker = null;

    // Listen for map movements and updates
    map.on('moveend', updateView);

    // Allow user to click on map to set coordinates for a new report
    map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        
        document.getElementById('station-lat').value = lat.toFixed(6);
        document.getElementById('station-lng').value = lng.toFixed(6);

        // Highlight the clicked point with a temporary blue marker
        if (clickMarker) {
            map.removeLayer(clickMarker);
        }
        clickMarker = L.marker([lat, lng], {
            icon: L.divIcon({
                className: 'click-pin',
                html: '<div style="background-color: #3b82f6; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.4)"></div>',
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            })
        }).addTo(map);
    });

    // Execute Nominatim search to zoom/pan to a typed location
    async function executeSearch() {
        const query = document.getElementById('map-search').value;
        if (!query) return;

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await response.json();
            
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                map.setView([lat, lon], 13);
            } else {
                alert("Location not found. Try a different city or ZIP code!");
            }
        } catch (error) {
            console.error("Geocoding failed:", error);
        }
    }

    // Handles adding a new reported station
    function handleReportSubmit(e) {
        e.preventDefault();
        
        const lat = parseFloat(document.getElementById('station-lat').value);
        const lng = parseFloat(document.getElementById('station-lng').value);
        const name = document.getElementById('station-name').value;
        const address = document.getElementById('station-address').value;
        const fuelType = document.getElementById('fuel-type').value;
        const price = parseFloat(document.getElementById('gas-price').value);
        const highwayDist = document.getElementById('highway-dist').value;
        
        const restrooms = document.getElementById('amenity-restroom').checked;
        const store = document.getElementById('amenity-store').checked;
        const food = document.getElementById('amenity-food').checked;
        const ev = document.getElementById('amenity-ev').checked;

        const newStation = {
            id: Date.now(),
            name,
            address,
            lat,
            lng,
            fuelType,
            price,
            highwayDist,
            amenities: { restrooms, store, food, ev }
        };

        stations.push(newStation);
        
        // Remove click marker pin
        if (clickMarker) {
            map.removeLayer(clickMarker);
            clickMarker = null;
        }

        // Move map view to the new station
        map.setView([lat, lng], 13);
        
        document.getElementById('report-form').reset();
        updateView();
    }

    // Core logic: filter and render both the map markers and the sidebar lists dynamically 
    function updateView() {
        const listContainer = document.getElementById('station-list');
        const fuelFilter = document.getElementById('filter-fuel').value;
        const amenityFilter = document.getElementById('filter-amenity').value;
        const mapBounds = map.getBounds();

        // 1. Clear current map markers
        mapMarkers.forEach(marker => map.removeLayer(marker));
        mapMarkers = [];
        listContainer.innerHTML = "";

        // 2. Filter list by map boundaries AND filter categories
        const visibleStations = stations.filter(station => {
            const insideMap = mapBounds.contains([station.lat, station.lng]);
            const matchesFuel = (fuelFilter === "All" || station.fuelType === fuelFilter);
            const matchesAmenity = (amenityFilter === "Any" || station.amenities[amenityFilter] === true);
            return insideMap && matchesFuel && matchesAmenity;
        });

        if (visibleStations.length === 0) {
            listContainer.innerHTML = `<div class="card" style="text-align:center; color: var(--text-light)">No gas stations in this map window match your filters. Move/zoom the map or adjust filters to see more!</div>`;
            return;
        }

        // 3. Render markers & list items
        visibleStations.forEach(station => {
            // Plot Marker on Map
            const marker = L.marker([station.lat, station.lng])
                .addTo(map)
                .bindPopup(`<strong>${station.name}</strong><br>$${station.price.toFixed(2)} (${station.fuelType})<br>${station.address}`);
            
            mapMarkers.push(marker);

            // Construct list sidebar card
            const card = document.createElement('div');
            card.className = 'station-card';
            card.onclick = () => {
                map.setView([station.lat, station.lng], 15);
                marker.openPopup();
            };
            
            let amenityBadges = '';
            if (station.amenities.restrooms) amenityBadges += `<span class="amenity-badge">🚻 Restrooms</span>`;
            if (station.amenities.store) amenityBadges += `<span class="amenity-badge">🏪 Store</span>`;
            if (station.amenities.food) amenityBadges += `<span class="amenity-badge highlight">🍔 Food</span>`;
            if (station.amenities.ev) amenityBadges += `<span class="amenity-badge highlight">⚡ EV</span>`;

            card.innerHTML = `
                <div class="station-header">
                    <div class="station-title">
                        <h3>${station.name}</h3>
                        <p>${station.address}</p>
                    </div>
                    <div class="price-badge">$${station.price.toFixed(2)}</div>
                </div>
                <div class="highway-info">
                    📍 Dist: <strong>${station.highwayDist}</strong> (${station.fuelType})
                </div>
                <div class="amenity-container">
                    ${amenityBadges || '<span class="amenity-badge">No listed amenities</span>'}
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    // Run update on load
    updateView();
</script>

</body>
</html>
