<script>
    const fields = ['tagSize', 'bizName', 'certNum', 'grantNum', 'harvestDate', 'harvestTime', 'species', 'sizeGrade', 'quantity', 'growingArea', 'sanitaryStatus'];

    window.addEventListener('DOMContentLoaded', () => {
      fields.forEach(id => {
        const val = localStorage.getItem('ma_tag_' + id);
        if (val && id !== 'harvestDate' && id !== 'harvestTime') {
          document.getElementById(id).value = val;
        }
      });

      const now = new Date();
      document.getElementById('harvestDate').value = now.toISOString().split('T')[0];
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('harvestTime').value = `${hours}:${minutes}`;

      updateTag();
    });

    fields.forEach(id => {
      const el = document.getElementById(id);
      ['change', 'input'].forEach(evt => {
        el.addEventListener(evt, () => {
          updateTag();
          if (id !== 'harvestDate' && id !== 'harvestTime') {
            localStorage.setItem('ma_tag_' + id, el.value);
          }
        });
      });
    });

    function formatDate(rawDate) {
      if (!rawDate) return '--';
      const [year, month, day] = rawDate.split('-');
      return `${month}/${day}/${year}`;
    }

    function formatTime(rawTime) {
      if (!rawTime) return '--';
      let [hours, minutes] = rawTime.split(':');
      hours = parseInt(hours, 10);
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      return `${hours}:${minutes} ${ampm}`;
    }

    function updateTag() {
      const tagElement = document.getElementById('tag');
      const sizeValue = document.getElementById('tagSize').value;
      const dynamicStyle = document.getElementById('dynamic-print-style');

      tagElement.classList.remove('size-4x6', 'size-3x7', 'size-3x5');

      if (sizeValue === '3x5') {
        tagElement.classList.add('size-3x5');
        dynamicStyle.textContent = '@page { size: 3in 5in; margin: 0; }';
      } else if (sizeValue === '3x7') {
        tagElement.classList.add('size-3x7');
        dynamicStyle.textContent = '@page { size: 3in 7in; margin: 0; }';
      } else {
        tagElement.classList.add('size-4x6');
        dynamicStyle.textContent = '@page { size: 4in 6in; margin: 0; }';
      }

      document.getElementById('out-biz-name').textContent = (document.getElementById('bizName').value || 'BAYSTATE SHELLFISH CO.').toUpperCase();
      document.getElementById('out-cert').textContent = (document.getElementById('certNum').value || '--').toUpperCase();
      document.getElementById('out-grant').textContent = (document.getElementById('grantNum').value || '--').toUpperCase();
      
      const rawDate = document.getElementById('harvestDate').value;
      const rawTime = document.getElementById('harvestTime').value;
      
      document.getElementById('out-date').textContent = formatDate(rawDate);
      document.getElementById('out-time').textContent = formatTime(rawTime);
      
      const area = (document.getElementById('growingArea').value || '--').toUpperCase();
      const status = (document.getElementById('sanitaryStatus').value || 'Approved').toUpperCase();
      document.getElementById('out-area').textContent = `${area} (${status})`;

      const species = (document.getElementById('species').value || '--').toUpperCase();
      const sizeGrade = (document.getElementById('sizeGrade').value || '--').toUpperCase();
      document.getElementById('out-species').textContent = `${species} - ${sizeGrade}`;

      document.getElementById('out-quantity').textContent = (document.getElementById('quantity').value || '--').toUpperCase();
    }

    // Web Serial Print Handler (Full-Width Row Stack Layout)
    async function printViaWebSerial() {
      if (!('serial' in navigator)) {
        alert('Web Serial API is not supported on this browser. Please use Chrome on Android or Desktop.');
        return;
      }

      const copiesInput = prompt('Enter number of tag copies to print:', '1');
      if (!copiesInput) return;
      const numCopies = parseInt(copiesInput, 10);
      if (isNaN(numCopies) || numCopies <= 0) {
        alert('Please enter a valid number of copies.');
        return;
      }

      const sizeValue = document.getElementById('tagSize').value;
      
      let widthMm = 101.6, heightMm = 152.4;
      if (sizeValue === '3x7') { widthMm = 76.2; heightMm = 177.8; }
      else if (sizeValue === '3x5') { widthMm = 76.2; heightMm = 127.0; }

      const maxDotsX = Math.round(widthMm * 8);
      const maxDotsY = Math.round(heightMm * 8);

      const bizName = document.getElementById('out-biz-name').textContent;
      const cert = document.getElementById('out-cert').textContent;
      const grant = document.getElementById('out-grant').textContent;
      const dateStr = document.getElementById('out-date').textContent;
      const timeStr = document.getElementById('out-time').textContent;
      const areaStr = document.getElementById('out-area').textContent;
      const speciesStr = document.getElementById('out-species').textContent;
      const qtyStr = document.getElementById('out-quantity').textContent;

      const margin = 24;
      const usableWidth = maxDotsX - (margin * 2);
      
      const headerSpace = 90;
      const footerSpace = 65;
      
      // We have 7 distinct data fields, each getting its own dedicated full-width row
      const availableBodyHeight = (maxDotsY - (margin * 2)) - headerSpace - footerSpace;
      const rowHeight = Math.floor(availableBodyHeight / 7);
      
      let currentY = margin;
      let tsplTextCmds = [];
      
      // Force TSPL Language Mode & Clear Buffer
      tsplTextCmds.push(`SET LANGUAGE TSPL`);
      tsplTextCmds.push(`CLS`);

      // Configuration & Sensor Setup
      tsplTextCmds.push(`SIZE ${widthMm} mm, ${heightMm} mm`);
      tsplTextCmds.push(`GAP 3 mm, 0 mm`);
      tsplTextCmds.push(`SPEED 3`);
      tsplTextCmds.push(`DENSITY 10`);
      tsplTextCmds.push(`DIRECTION 1`);
      tsplTextCmds.push(`REFERENCE 0,0`);
      tsplTextCmds.push(`SHIFT 0`);

      // Outer Bounding Box
      tsplTextCmds.push(`BOX ${margin}, ${margin}, ${maxDotsX - margin}, ${maxDotsY - margin}, 3`);

      // Header Section
      tsplTextCmds.push(`TEXT ${margin + 10}, ${currentY + 10}, "3", 0, 1, 1, "${bizName}"`);
      tsplTextCmds.push(`TEXT ${margin + 10}, ${currentY + 48}, "2", 0, 1, 1, "HARVESTER SHELLSTOCK TAG"`);
      currentY += headerSpace;
      tsplTextCmds.push(`BAR ${margin}, ${currentY}, ${usableWidth}, 3`);

      function addSingleRow(label, val) {
        tsplTextCmds.push(`TEXT ${margin + 10}, ${currentY + 8}, "1", 0, 1, 1, "${label}"`);
        tsplTextCmds.push(`TEXT ${margin + 10}, ${currentY + 28}, "2", 0, 1, 1, "${val}"`);
        
        currentY += rowHeight;
        tsplTextCmds.push(`BAR ${margin}, ${currentY}, ${usableWidth}, 2`);
      }

      // Every field gets its own full-width row
      addSingleRow("HARVESTER CERT / PERMIT #", cert);
      addSingleRow("AQUACULTURE GRANT #", grant);
      addSingleRow("HARVEST DATE", dateStr);
      addSingleRow("HARVEST TIME", timeStr);
      addSingleRow("GROWING AREA / STATUS", areaStr);
      addSingleRow("SPECIES & SIZE", speciesStr);
      addSingleRow("QUANTITY", qtyStr);

      // Footer Notice Block
      const footerY = maxDotsY - margin - footerSpace;
      tsplTextCmds.push(`TEXT ${margin + 10}, ${footerY + 8}, "1", 0, 1, 1, "THIS TAG IS REQUIRED TO BE ATTACHED UNTIL"`);
      tsplTextCmds.push(`TEXT ${margin + 10}, ${footerY + 26}, "1", 0, 1, 1, "CONTAINER IS EMPTY OR RETAGGED AND"`);
      tsplTextCmds.push(`TEXT ${margin + 10}, ${footerY + 44}, "1", 0, 1, 1, "THEREAFTER KEPT ON FILE FOR 90 DAYS."`);

      tsplTextCmds.push(`PRINT 1, ${numCopies}`);

      const textBlock = tsplTextCmds.join('\r\n') + '\r\n';
      const encoder = new TextEncoder();

      try {
        const port = await navigator.serial.requestPort();
        
        await port.open({ 
          baudRate: 115200,
          dataBits: 8,
          stopBits: 1,
          parity: 'none',
          flowControl: 'none'
        });

        const writer = port.writable.getWriter();
        await writer.write(encoder.encode(textBlock));
        await writer.releaseLock();
        await port.close();

        alert(`Successfully sent ${numCopies} copy(ies) via Bluetooth Serial!`);
      } catch (error) {
        console.error(error);
        if (error.name !== 'NotFoundError') {
          alert('Serial print error: ' + error.message);
        }
      }
    }

    // Local USB / System Print Handler
    function printViaUSB() {
      const copiesInput = prompt('Enter number of tag copies to print:', '1');
      if (!copiesInput) return;
      const numCopies = parseInt(copiesInput, 10);
      if (isNaN(numCopies) || numCopies <= 0) {
        alert('Please enter a valid number of copies.');
        return;
      }

      const previewContainer = document.getElementById('previewContainer');
      const originalTag = document.getElementById('tag');
      
      const clones = [];
      for (let i = 1; i < numCopies; i++) {
        const clone = originalTag.cloneNode(true);
        clone.removeAttribute('id');
        previewContainer.appendChild(clone);
        clones.push(clone);
      }

      window.print();

      setTimeout(() => {
        clones.forEach(clone => clone.remove());
      }, 500);
    }
  </script>
